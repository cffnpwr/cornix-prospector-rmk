name: commitlint
on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  commitlint:
    uses: cffnpwr/actions/.github/workflows/commitlint.yaml@c36d4ebb8d880b45fd5e118b8ddf84f1bcb1d27e # main
    permissions:
      contents: read
      actions: read
