name: build
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - ".cargo/**"
      - "src/**"
      - "LICENSES/**"
      - "build.rs"
      - "Cargo.lock"
      - "Cargo.toml"
      - "keyboard.toml"
      - "memory.x"
      - "mise.lock"
      - "mise.toml"
      - "rust-toolchain.toml"
      - "vial.json"
      - ".github/workflows/build.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9

      - name: Build uf2 images
        run: mise run uf2

      - name: Upload firmware images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware
          path: |
            prospector-central.uf2
            cornix-left.uf2
            cornix-right.uf2
            LICENSES/*
          if-no-files-found: error
