name: clippy
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - ".cargo/**"
      - "src/**"
      - "build.rs"
      - "Cargo.lock"
      - "Cargo.toml"
      - "keyboard.toml"
      - "memory.x"
      - "mise.lock"
      - "mise.toml"
      - "rust-toolchain.toml"
      - "vial.json"
      - ".github/workflows/clippy.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  clippy:
    name: Run clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Run clippy
        run: mise run lint
