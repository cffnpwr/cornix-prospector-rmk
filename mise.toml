[settings]
lockfile = true
idiomatic_version_file_enable_tools = ["rust"]

[tools]
# miseのpypi backendがyamllintのインストールに使用する
uv = "0.13.8"
yamlfmt = "0.21.0"
tombi = "1.5.4"
rumdl = "v0.3.4"
yamllint = "1.38.0"
"aqua:numtide/treefmt" = "2.6.0"
"aqua:sharkdp/fd" = "10.5.2"
"cargo:flip-link" = "0.1.12"
"cargo:cargo-binutils" = "0.4.0"
"cargo:cargo-hex-to-uf2" = "0.1.2"

[tools."http:arm-gnu-toolchain"]
version = "15.2.rel1"

[tools."http:arm-gnu-toolchain".platforms]
linux-arm64 = { url = "https://developer.arm.com/-/media/Files/downloads/gnu/{{ version }}/binrel/arm-gnu-toolchain-{{ version }}-aarch64-arm-none-eabi.tar.xz", checksum_url = "https://developer.arm.com/-/media/Files/downloads/gnu/{{ version }}/binrel/arm-gnu-toolchain-{{ version }}-aarch64-arm-none-eabi.tar.xz.sha256asc" }
linux-x64 = { url = "https://developer.arm.com/-/media/Files/downloads/gnu/{{ version }}/binrel/arm-gnu-toolchain-{{ version }}-x86_64-arm-none-eabi.tar.xz", checksum_url = "https://developer.arm.com/-/media/Files/downloads/gnu/{{ version }}/binrel/arm-gnu-toolchain-{{ version }}-x86_64-arm-none-eabi.tar.xz.sha256asc" }
macos-arm64 = { url = "https://developer.arm.com/-/media/Files/downloads/gnu/{{ version }}/binrel/arm-gnu-toolchain-{{ version }}-darwin-arm64-arm-none-eabi.tar.xz", checksum_url = "https://developer.arm.com/-/media/Files/downloads/gnu/{{ version }}/binrel/arm-gnu-toolchain-{{ version }}-darwin-arm64-arm-none-eabi.tar.xz.sha256asc" }

[tasks.build]
description = "Build dongle central and left/right peripheral firmware"
run = "cargo build --release"

[tasks.hex]
description = "Generate Intel HEX images"
depends = ["build"]
run = [
  "cargo objcopy --release --bin central -- -O ihex prospector-central.hex",
  "cargo objcopy --release --bin peripheral_left -- -O ihex cornix-left.hex",
  "cargo objcopy --release --bin peripheral_right -- -O ihex cornix-right.hex",
]

[tasks.uf2]
description = "Generate uf2 images"
depends = ["hex"]
run = [
  "cargo hex-to-uf2 --input-path prospector-central.hex --output-path prospector-central.uf2 --family nrf52840",
  "cargo hex-to-uf2 --input-path cornix-left.hex --output-path cornix-left.uf2 --family nrf52840",
  "cargo hex-to-uf2 --input-path cornix-right.hex --output-path cornix-right.uf2 --family nrf52840",
]

[tasks.lint]
description = "Lint Rust, formatting, Markdown and YAML"
depends = ["lint:rust", "lint:format", "lint:markdown", "lint:yaml"]

[tasks."lint:rust"]
description = "Run clippy linter"
run = "cargo clippy --all-features -- -D warnings"

[tasks."lint:format"]
description = "Check that files are formatted"
run = "mise run fmt --ci"

[tasks."lint:markdown"]
description = "Lint Markdown"
run = "rumdl check ."

[tasks."lint:yaml"]
description = "Lint YAML"
# yamllintは.gitignoreを読まないため、.gitignoreに従うfdで対象のファイルを列挙
run = "fd --hidden --exclude .git --type file --extension yaml --extension yml --exec-batch yamllint"

[tasks.fmt]
description = "Run treefmt"
run = "treefmt --tree-root . --walk filesystem --fail-on-change"
