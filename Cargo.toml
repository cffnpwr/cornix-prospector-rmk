# release-pleaseのCargo.tomlパーサ(@iarna/toml)がTOML v1.1.0の複数行インラインテーブルを解釈できないため、
# tombiの整形をv1.0.0に固定する
#:tombi toml-version = "v1.0.0"

[package]
name = "cornix-prospector-rmk"
version = "1.0.1"
edition = "2024"

[[bin]]
name = "central"
path = "src/central.rs"

[[bin]]
name = "peripheral_left"
path = "src/peripheral_left.rs"

[[bin]]
name = "peripheral_right"
path = "src/peripheral_right.rs"

[dependencies]
bt-hci = { version = "=0.9.0", default-features = false, features = ["defmt"] }
nrf-mpsl = { git = "https://github.com/alexmoon/nrf-sdc", rev = "abe49d22ebfc85fae134eb082fbfddf752016a55", features = [
  "critical-section-impl",
  "defmt",
  "nrf52840",
] }
nrf-sdc = { git = "https://github.com/alexmoon/nrf-sdc", rev = "abe49d22ebfc85fae134eb082fbfddf752016a55", features = [
  "central",
  "defmt",
  "nrf52840",
  "peripheral",
] }
rmk = { git = "https://github.com/rmk-rs/rmk", rev = "fe211575308f8d0d1cb2062713f1bc6f5764082c", features = [
  "adafruit_bl",
  "async_matrix",
  "nrf52840_ble",
  "split",
  "st7789",
] }

cortex-m = "=0.7.7"
cortex-m-rt = "=0.7.6"
defmt = "=1.1.1"
defmt-rtt = "=1.3.0"
embassy-executor = { version = "=0.10.0", features = [
  "defmt",
  "executor-thread",
  "platform-cortex-m",
] }
embassy-nrf = { version = "=0.11.0", features = [
  "defmt",
  "gpiote",
  "nfc-pins-as-gpio",
  "nrf52840",
  "time",
  "time-driver-rtc1",
  "unstable-pac",
] }
embedded-graphics = "=0.8.2"
embedded-hal = "=1.0.0"
embedded-hal-bus = { version = "=0.3.0", features = ["async"] }
u8g2-fonts = "=0.8.0"

embassy-time = { version = "=0.5.1", features = [
  "defmt",
  "defmt-timestamp-uptime",
  "tick-hz-32_768",
] }
panic-probe = { version = "=1.0.0", features = ["print-defmt"] }
static_cell = "=2.1.1"

[build-dependencies]
json = "=0.12.4"
xz2 = "=0.1.7"

[lints.clippy]
absolute_paths = "deny"
all = "deny"
allow_attributes_without_reason = "deny"
clone_on_ref_ptr = "deny"
manual_assert = "deny"
mod_module_files = "deny"
panic = "deny"
pedantic = "deny"
unused_trait_names = "deny"
unwrap_used = "deny"

[lints.rust]
warnings = "deny"

[profile.dev]
opt-level = 1
debug = true
overflow-checks = true
lto = false
panic = "unwind"
codegen-units = 1

[profile.release]
opt-level = "z"
debug = true
overflow-checks = false
lto = "fat"
codegen-units = 1
